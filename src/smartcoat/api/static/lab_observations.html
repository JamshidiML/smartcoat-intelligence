<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>SmartCoat Lab Observations</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f3f5f2;
      --surface: #ffffff;
      --surface-subtle: #e8ece8;
      --ink: #18211f;
      --muted: #5d6965;
      --line: #cbd2ce;
      --primary: #175c4c;
      --primary-hover: #10483b;
      --accent: #b97716;
      --danger: #a23d32;
      --success: #1c6b50;
      --focus: #286c9d;
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--canvas);
      color: var(--ink);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button,
    input,
    textarea {
      border-radius: var(--radius);
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 35%, transparent);
      outline-offset: 1px;
    }

    .app-header {
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .app-header__inner,
    .workspace {
      width: min(100% - 32px, 1240px);
      margin-inline: auto;
    }

    .app-header__inner {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 750;
      text-transform: uppercase;
    }

    h1,
    h2 {
      margin: 0;
      font-weight: 680;
      letter-spacing: 0;
    }

    h1 {
      font-size: 1.45rem;
    }

    h2 {
      font-size: 1.05rem;
    }

    .workspace {
      padding-block: 24px 48px;
    }

    .workspace-section {
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .workspace-section + .workspace-section {
      margin-top: 18px;
    }

    .section-header {
      display: flex;
      min-height: 54px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-subtle);
    }

    .section-body {
      padding: 18px;
    }

    .connection-grid {
      display: grid;
      grid-template-columns: minmax(220px, 420px) 1fr;
      gap: 20px;
      align-items: end;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 650;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #aeb8b3;
      background: var(--surface);
      color: var(--ink);
      padding: 9px 10px;
    }

    input {
      min-height: 40px;
    }

    textarea {
      min-height: 112px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--focus);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px 18px;
    }

    .field--wide {
      grid-column: 1 / -1;
    }

    .form-actions,
    .list-actions,
    .pagination {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .form-actions {
      justify-content: space-between;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    button {
      min-height: 38px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: 7px 13px;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    button[type="submit"] {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    button[type="submit"]:hover:not(:disabled) {
      background: var(--primary-hover);
      color: #ffffff;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .message {
      min-height: 1.5em;
      margin: 0;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .message[data-state="error"] {
      color: var(--danger);
    }

    .message[data-state="success"] {
      color: var(--success);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 940px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f7f8f6;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    td {
      max-width: 320px;
      overflow-wrap: anywhere;
    }

    tbody tr:hover {
      background: #f7faf8;
    }

    .empty-state {
      margin: 0;
      padding: 28px 18px;
      color: var(--muted);
      text-align: center;
    }

    .list-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
    }

    #page-status {
      min-width: 160px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    [hidden] {
      display: none;
    }

    @media (max-width: 720px) {
      .app-header__inner {
        min-height: 78px;
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
      }

      .workspace {
        width: min(100% - 20px, 1240px);
        padding-top: 14px;
      }

      .connection-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field--wide {
        grid-column: auto;
      }

      .section-header,
      .form-actions,
      .list-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .list-actions,
      .pagination {
        width: 100%;
      }

      .list-actions button,
      .pagination button {
        flex: 1;
      }

      #page-status {
        order: -1;
        width: 100%;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <header class='app-header'>
    <div class='app-header__inner'>
      <div class='brand'>SmartCoat</div>
      <h1>Lab observations</h1>
    </div>
  </header>

  <main class='workspace'>
    <section id='connection-section' class='workspace-section'>
      <div class='section-header'>
        <h2>Workspace</h2>
      </div>
      <div class='section-body connection-grid'>
        <div class='field'>
          <label for='organization-id'>Organization ID</label>
          <input
            id='organization-id'
            type='text'
            value='smartcoat-pilot'
            maxlength='512'
            autocomplete='off'
          >
        </div>
        <p id='connection-message' class='message' aria-live='polite'>Ready.</p>
      </div>
    </section>

    <section id='create-section' class='workspace-section'>
      <div class='section-header'>
        <h2>New observation</h2>
      </div>
      <form id='lab-observation-form' class='section-body'>
        <div class='form-grid'>
          <div class='field'>
            <label for='project-id'>Project ID</label>
            <input id='project-id' name='project_id' type='text' required maxlength='512'>
          </div>
          <div class='field'>
            <label for='project-name'>Project name</label>
            <input id='project-name' name='project_name' type='text' required maxlength='256'>
          </div>
          <div class='field field--wide'>
            <label for='title'>Title</label>
            <input id='title' name='title' type='text' required maxlength='256'>
          </div>
          <div class='field field--wide'>
            <label for='observation'>Observation</label>
            <textarea id='observation' name='observation' required maxlength='4096'></textarea>
          </div>
          <div class='field field--wide'>
            <label for='source-reference'>Source reference</label>
            <input
              id='source-reference'
              name='source_reference'
              type='text'
              required
              maxlength='2048'
            >
          </div>
          <div class='field'>
            <label for='observed-at'>Observed at</label>
            <input id='observed-at' name='observed_at' type='datetime-local' required>
          </div>
          <div class='field'>
            <label for='actor-id'>Actor ID</label>
            <input id='actor-id' name='actor_id' type='text' required maxlength='512'>
          </div>
          <div class='field'>
            <label for='actor-role'>Actor role</label>
            <input
              id='actor-role'
              name='actor_role'
              type='text'
              required
              maxlength='128'
              value='lab_engineer'
            >
          </div>
        </div>
        <div class='form-actions'>
          <p id='form-message' class='message' aria-live='polite'></p>
          <button id='submit-observation' type='submit'>Save observation</button>
        </div>
      </form>
    </section>

    <section id='list-section' class='workspace-section'>
      <div class='section-header'>
        <h2>Observations</h2>
        <div class='list-actions'>
          <button id='refresh-observations' type='button'>Refresh</button>
        </div>
      </div>
      <p id='list-message' class='message section-body' aria-live='polite'></p>
      <div class='table-wrap'>
        <table id='observations-table'>
          <thead>
            <tr>
              <th scope='col'>Observed at</th>
              <th scope='col'>Project</th>
              <th scope='col'>Title</th>
              <th scope='col'>Observation</th>
              <th scope='col'>Lifecycle</th>
              <th scope='col'>Revision</th>
              <th scope='col'>Object ID</th>
            </tr>
          </thead>
          <tbody id='observations-body'></tbody>
        </table>
        <p id='empty-state' class='empty-state' hidden>No observations</p>
      </div>
      <div class='list-footer'>
        <span id='page-status'>No observations</span>
        <div class='pagination'>
          <button id='previous-page' type='button' disabled>Previous</button>
          <button id='next-page' type='button' disabled>Next</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const pageLimit = 20;
    let currentOffset = 0;
    let currentHasMore = false;

    function organizationId() {
      const value = document.getElementById("organization-id").value.trim();
      if (!value) {
        throw new Error("Organization ID is required.");
      }
      return value;
    }

    function setMessage(elementId, message, isError) {
      const element = document.getElementById(elementId);
      element.textContent = message;
      element.dataset.state = isError ? "error" : "success";
    }

    function formatDate(value) {
      if (!value) {
        return "";
      }
      return new Date(value).toLocaleString();
    }

    function createCell(value) {
      const cell = document.createElement("td");
      cell.textContent = String(value ?? "");
      return cell;
    }

    function renderObservations(response) {
      const body = document.getElementById("observations-body");
      body.replaceChildren();

      for (const item of response.items) {
        const row = document.createElement("tr");
        row.append(
          createCell(formatDate(item.observed_at)),
          createCell(item.project_name),
          createCell(item.title),
          createCell(item.observation),
          createCell(item.lifecycle_state),
          createCell(item.revision),
          createCell(item.object_id)
        );
        body.append(row);
      }

      const isEmpty = response.items.length === 0;
      document.getElementById("empty-state").hidden = !isEmpty;
      document.getElementById("previous-page").disabled = currentOffset === 0;
      document.getElementById("next-page").disabled = !response.has_more;
      document.getElementById("page-status").textContent = isEmpty
        ? "No observations"
        : `Showing ${currentOffset + 1}\u2013${currentOffset + response.returned_count}`;
    }

    async function loadObservations() {
      try {
        const selectedOrganization = organizationId();
        const response = await fetch(
          `/api/v2/lab-observations?limit=${pageLimit}&offset=${currentOffset}`,
          {
            method: "GET",
            headers: {
              "X-SmartCoat-Organization-ID": selectedOrganization,
              Accept: "application/json"
            }
          }
        );
        if (!response.ok) {
          await response.text();
          throw new Error(`Unable to load observations (${response.status}).`);
        }
        const payload = await response.json();
        currentHasMore = payload.has_more;
        renderObservations(payload);
        setMessage("list-message", "Observations loaded.", false);
        setMessage(
          "connection-message",
          `Connected to ${selectedOrganization}.`,
          false
        );
      } catch (error) {
        const safeMessage = error instanceof Error
          ? error.message
          : "Unable to load observations.";
        setMessage("list-message", safeMessage, true);
        setMessage("connection-message", "Connection unavailable.", true);
      }
    }

    async function submitObservation(event) {
      event.preventDefault();
      const submitButton = document.getElementById("submit-observation");
      submitButton.disabled = true;

      try {
        const observedAt = document.getElementById("observed-at").value;
        const payload = {
          project_id: document.getElementById("project-id").value,
          project_name: document.getElementById("project-name").value,
          title: document.getElementById("title").value,
          observation: document.getElementById("observation").value,
          source_reference: document.getElementById("source-reference").value,
          observed_at: new Date(observedAt).toISOString(),
          actor_id: document.getElementById("actor-id").value,
          actor_role: document.getElementById("actor-role").value
        };
        const response = await fetch("/api/v2/lab-observations", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json",
            "X-SmartCoat-Organization-ID": organizationId()
          },
          body: JSON.stringify(payload)
        });
        if (response.status !== 201) {
          throw new Error(`Unable to save observation (${response.status}).`);
        }
        const responsePayload = await response.json();
        setMessage(
          "form-message",
          `Saved observation ${responsePayload.observation.object_id}.`,
          false
        );
        document.getElementById("title").value = "";
        document.getElementById("observation").value = "";
        document.getElementById("source-reference").value = "";
        document.getElementById("observed-at").value = "";
        currentOffset = 0;
        await loadObservations();
      } catch (error) {
        const safeMessage = error instanceof Error
          ? error.message
          : "Unable to save observation.";
        setMessage("form-message", safeMessage, true);
      } finally {
        submitButton.disabled = false;
      }
    }

    document
      .getElementById("lab-observation-form")
      .addEventListener("submit", submitObservation);
    document
      .getElementById("refresh-observations")
      .addEventListener("click", loadObservations);
    document.getElementById("previous-page").addEventListener("click", () => {
      currentOffset = Math.max(0, currentOffset - pageLimit);
      loadObservations();
    });
    document.getElementById("next-page").addEventListener("click", () => {
      if (currentHasMore) {
        currentOffset += pageLimit;
        loadObservations();
      }
    });
    document.getElementById("organization-id").addEventListener("change", () => {
      currentOffset = 0;
      loadObservations();
    });
    document.addEventListener("DOMContentLoaded", () => {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById("observed-at").value = now
        .toISOString()
        .slice(0, 16);
      loadObservations();
    });
  </script>
</body>
</html>
