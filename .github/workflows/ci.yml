name: SmartCoat CI

on:
  pull_request:
    branches:
      - main
      - release/**
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/constraints-py312.txt

      - name: Install project and dev dependencies
        run: python -m pip install --constraint requirements/constraints-py312.txt -e '.[dev]'

      - name: Verify installed dependency compatibility
        run: python -m pip check

      - name: Run Ruff checks
        run: python -m ruff check .

      - name: Verify Ruff formatting
        run: python -m ruff format --check .

      - name: Run MyPy
        run: python -m mypy src

      - name: Run unit and route tests
        run: python -m pytest

  postgres:
    name: PostgreSQL 16 migrations and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartcoat
          POSTGRES_PASSWORD: smartcoat
          POSTGRES_DB: smartcoat_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcoat -d smartcoat_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SMARTCOAT_RUN_LIVE_POSTGRES_TESTS: "true"
      SMARTCOAT_TEST_DATABASE_URL: postgresql+psycopg://smartcoat:smartcoat@localhost:5432/smartcoat_test_ci
      SMARTCOAT_TEST_SCHEMA: smartcoat_test_ci_legacy_api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report checked-out revision scope
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/pull/*/merge ]]; then
            echo "Validation scope: pull-request merge ref at $GITHUB_SHA"
          else
            echo "Validation scope: literal branch ref $GITHUB_REF at $GITHUB_SHA"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/constraints-py312.txt

      - name: Install project and dev dependencies
        run: python -m pip install --constraint requirements/constraints-py312.txt -e '.[dev]'

      - name: Verify installed dependency compatibility
        run: python -m pip check

      - name: Run live migration and persistence suite
        run: >-
          python -m pytest
          tests/integration/test_qc_observation_api_postgres.py
          tests/integration/test_lab_observation_api_postgres.py
          tests/integration/test_knowledge_query_postgres.py
          tests/integration/test_knowledge_audit_postgres.py
          tests/integration/test_knowledge_v2_postgres.py
          tests/integration/test_persistent_api_postgres.py
