name: SmartCoat CI

on:
  pull_request:
    branches:
      - main
      - release/**
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/constraints-py312.txt

      - name: Install project and dev dependencies
        run: python -m pip install --constraint requirements/constraints-py312.txt -e '.[dev]'

      - name: Verify installed dependency compatibility
        run: python -m pip check

      - name: Run unit and route tests
        run: python -m pytest
